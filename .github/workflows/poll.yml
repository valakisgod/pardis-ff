name: Poll Bale messages

on:
  schedule:
    # هر ۵ دقیقه یک‌بار (کمترین فاصله‌ی مجازِ GitHub؛ گاهی چند دقیقه تأخیر داره، طبیعیه)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
    # اجرای دستی از تبِ Actions توی گیت‌هاب، برای تست

# جلوی اجرای هم‌زمانِ دو نمونه رو می‌گیره (مثلاً زمان‌بندیِ گیت‌هاب + تریگرِ بیرونی)،
# چون دو نمونه با هم ممکنه یه آگهی رو دوبار اعلان بدن.
concurrency:
  group: poll-bale
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # اجرای گیرکرده خودش بعد از ۵ دقیقه تموم بشه تا صفِ اجراهای بعدی رو (به‌خاطرِ قفلِ concurrency) نبنده
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node poll-once.js
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
